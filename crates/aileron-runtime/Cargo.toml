[package]
name = "aileron-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
llama-server = ["dep:reqwest", "dep:tempfile", "dep:nix", "dep:signal-hook", "dep:uuid"]
whisper = ["dep:whisper-rs"]
whisper-cuda = ["whisper", "whisper-rs/cuda"]
whisper-rocm = ["whisper", "whisper-rs/hipblas"]
whisper-vulkan = ["whisper", "whisper-rs/vulkan"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# Container-private HTTP needs neither TLS nor system proxy discovery.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"], optional = true }
tempfile = { version = "3", optional = true }
nix = { version = "0.31", features = ["signal"], optional = true }
signal-hook = { version = "0.4", optional = true }
uuid = { workspace = true, optional = true }
whisper-rs = { version = "0.16.0", optional = true }

[[bin]]
name = "aileron-runtime-llm-llama-server"
path = "src/bin/llm_llama_server.rs"
required-features = ["llama-server"]

[[bin]]
name = "aileron-runtime-stub"
path = "src/bin/stub.rs"

[[bin]]
name = "aileron-runtime-asr-whisper-cpp"
path = "src/bin/asr_whisper_cpp.rs"
required-features = ["whisper"]
